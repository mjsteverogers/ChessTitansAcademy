<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Titans Academy - Admin Dashboard</title>
    <link rel="icon" href="images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12', },
                        secondary: { 900: '#1a1a1a', 800: '#262626', }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fff7ed;
            background-image: linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh; height: 100dvh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.1);
            box-shadow: 0 20px 25px -5px rgba(234, 88, 12, 0.1), 0 8px 10px -6px rgba(234, 88, 12, 0.1);
        }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #ea580c;
            width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Animation for Dancing Robot */
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-15deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-4px) rotate(15deg); }
        }
        .animate-dance {
            animation: dance 1s ease-in-out infinite;
            transform-origin: bottom center;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .snap-x-mandatory { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        /* Custom Calendar Grid */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #f1f5f9; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;}
        .calendar-day.attended { background-color: #ecfdf5; border-color: #10b981; color: #065f46; }
        .calendar-day.pending { background-color: #fffbeb; border-color: #f59e0b; color: #b45309; }
        .calendar-day.admin-interactive:hover { border-color: #10b981; background-color: #f0fdf4; }
        .calendar-mark { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #10b981; margin: 1px; }
        .calendar-mark-pending { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #f59e0b; margin: 1px; }
    </style>
</head>
<body class="antialiased text-slate-800 flex flex-col overflow-hidden">

    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4 md:px-0 ml-auto"></div>

    <div id="app" class="flex-grow flex items-center justify-center p-4 w-full h-full relative">
        <div class="text-brand-600 font-bold flex flex-col items-center">
            <div class="loader mb-2 w-8 h-8 border-4"></div>
            Connecting to Academy Server...
        </div>
    </div>

    <div id="global-modals"></div>

    <script>
        // --- API & ROUTE CONFIGURATION ---
        const API_URL = 'https://script.google.com/macros/s/AKfycbwx4Npt8Y5iCaEVcYDO9kFl8rcrI1nt7PjyZxDLDSioprkpGVy_l9g4Ak0n_LHJK0mGtA/exec';

        const ROUTES = {
            login: 'index.html',
            student: 'student.html',
            adminDashboard: 'admin.html',
            unrankedStudents: 'unranked.html',
            expiredStudents: 'expired.html',
            pendingStudents: 'pending.html',
            adminAttendance: 'attendance.html',
            initialStudents: 'initial.html',
            attendanceApproval: 'attendance-approval.html',
            adminExams: 'exams.html',
            puzzleBooks: 'puzzle-books.html',
            academyTieup: 'tieup.html',
            activityLogs: 'activity-logs.html'
        };

        const ACADEMY_LEVELS = [
            'Initial','Beginner Level 1', 'Beginner Level 2',
            'Intermediate Level 1', 'Intermediate Level 2',
            'Advance Level 1', 'Advance Level 2', 'Advance Level 3',
            'Advance Pro',
            'Tournament Puzzles',
            'Exam'
        ];

        const ACADEMY_BRANCHES = [
            'Noombal Branch',
            'Iyyappanthangal Branch',
            'Poonamallee Branch',
            'Mangadu Branch',
            'Online Batch'
        ];

        function getLevelPrice(level) {
            if (!level || level === 'Unranked') return 200;
            if (level === 'Initial') return 0;
            if (level === 'Tournament Puzzles') return 500;
            if (level === 'Exam') return 200;
            if (level.includes('Advance Pro')) return 500;
            if (level.includes('Advance Level')) return 400;
            if (level.includes('Intermediate')) return 300;
            if (level.includes('Beginner')) return 200;
            return 200;
        }

        function escapeJs(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function escapeAttr(str) {
            const amp = String.fromCharCode(38);
            return String(str || '')
                .replace(/&/g, amp + 'amp;')
                .replace(/"/g, amp + 'quot;')
                .replace(/</g, amp + 'lt;')
                .replace(/>/g, amp + 'gt;');
        }

        window.currentUser = null;
        window.cachedData = null;
        window.adminStudentCalUsername = null;
        window.adminStudentCalDate = new Date();

        // --- DATA MANAGEMENT ---
        async function fetchUsers() { try { return await (await fetch(`${API_URL}?action=getUsers`)).json(); } catch (e) { return null; } }
        async function fetchTasks() { try { return await (await fetch(`${API_URL}?action=getTasks`)).json(); } catch (e) { return []; } }
        async function fetchSubmissions() { try { return await (await fetch(`${API_URL}?action=getSubmissions`)).json(); } catch (e) { return []; } }
        async function fetchSettings() { try { return await (await fetch(`${API_URL}?action=getSettings`)).json(); } catch (e) { return {}; } }
        async function fetchAttendance() { try { return await (await fetch(`${API_URL}?action=getAttendance`)).json(); } catch (e) { return []; } }

        async function updateUserStatusAPI(username, status) { return await sendPostRequest({ action: 'updateStatus', username: username, status: status }); }
        async function updateUserLevelAPI(username, level) { return await sendPostRequest({ action: 'updateLevel', username: username, level: level }); }
        async function updateUserDatesAPI(username, type, value) { return await sendPostRequest({ action: 'updateUserDates', username: username, type: type, value: value }); }
        async function updateUserFeeAPI(username, fee) { return await sendPostRequest({ action: 'updateUserFee', username: username, fee: fee }); }
        async function updateBranchAPI(username, branch) { return await sendPostRequest({ action: 'updateBranch', username: username, branch: branch }); }
        async function updateSettingsAPI(tLink, tVideo, tAccess, tPin) {
            return await sendPostRequest({
                action: 'updateSettings',
                tournamentLink: tLink,
                tournamentVideo: tVideo,
                tournamentAccess: tAccess,
                tournamentPin: tPin
            });
        }
        async function addTaskAPI(data) { return await sendPostRequest({ action: 'addTask', data: data }); }
        async function deleteTaskAPI(id) { return await sendPostRequest({ action: 'deleteTask', id: id }); }
        async function updateSubmissionStatusAPI(id, status, remarks) { return await sendPostRequest({ action: 'gradeSubmission', id: id, status: status, remarks: remarks }); }
        async function deleteSubmissionAPI(id) { return await sendPostRequest({ action: 'deleteSubmission', id: id }); }
        async function deleteUserAPI(username) { return await sendPostRequest({ action: 'deleteUser', username: username }); }

        async function sendPostRequest(data) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (err) {
                    return { success: false, message: "Server response was invalid or timed out." };
                }
            } catch (error) {
                return { success: false, message: error.message };
            }
        }

        // --- UI UTILITIES ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white border-l-4 border-emerald-800',
                error: 'bg-red-500 text-white border-l-4 border-red-800',
                info: 'bg-brand-600 text-white border-l-4 border-brand-800'
            };
            const icons = {
                success: '<i class="fas fa-check-circle mr-2"></i>',
                error: '<i class="fas fa-exclamation-triangle mr-2"></i>',
                info: '<i class="fas fa-info-circle mr-2"></i>'
            };
            toast.className = `${colors[type]} px-4 py-3 md:px-6 md:py-4 rounded shadow-2xl transform transition-all duration-300 translate-x-full pointer-events-auto flex items-center font-medium text-sm md:text-base`;
            toast.innerHTML = `${icons[type]} <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setButtonLoading(btn, isLoading, text = "") {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<div class="loader inline-block mr-2 border-white border-t-transparent w-4 h-4"></div> Processing...`;
            } else {
                btn.disabled = false;
                btn.innerHTML = text;
            }
        }

        function formatDateForInput(isoString) {
            if (!isoString) return "";
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return "";
            const localDate = new Date(d.getTime() - (d.getTimezoneOffset() * 60000));
            return localDate.toISOString().slice(0, 16);
        }

        // --- SIDEBAR GENERATOR ---
        function getAdminSidebar(activeTab, unrankedCount, expiredCount, pendingCount, pendingAttCount = 0, initialCount = 0, tieupCount = 0) {
            const expiredBadge = expiredCount > 0 ? `<span class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${expiredCount}</span>` : '';
            const pendingBadge = pendingCount > 0 ? `<span class="ml-auto bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${pendingCount}</span>` : '';
            const unrankedBadge = unrankedCount > 0 ? `<span class="ml-auto bg-brand-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${unrankedCount}</span>` : '';
            const initialBadge = initialCount > 0 ? `<span class="ml-auto bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${initialCount}</span>` : '';
            const attBadge = pendingAttCount > 0 ? `<span class="ml-auto bg-blue-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${pendingAttCount}</span>` : '';
            const tieupBadge = tieupCount > 0 ? `<span class="ml-auto bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${tieupCount}</span>` : '';

            const tabs = [
                { id: 'adminDashboard', icon: 'fa-users-cog', label: 'Dashboard', badge: '' },
                { id: 'unrankedStudents', icon: 'fa-user-tag', label: 'Unranked Students', badge: unrankedBadge },
                { id: 'expiredStudents', icon: 'fa-clock', label: 'Plan Expired Students', badge: expiredBadge },
                { id: 'pendingStudents', icon: 'fa-user-clock', label: 'Pending Students', badge: pendingBadge },
                { id: 'adminAttendance', icon: 'fa-calendar-check', label: 'Student Attendance', badge: '' },
                { id: 'initialStudents', icon: 'fa-chess-pawn', label: 'Initial Grade Students', badge: initialBadge },
                { id: 'attendanceApproval', icon: 'fa-check-double', label: 'Attendance Approval', badge: attBadge },
                { id: 'adminExams', icon: 'fa-file-signature', label: 'Manage Exams', badge: '' },
                { id: 'puzzleBooks', icon: 'fa-book-open', label: 'Puzzle Book Upload', badge: '' },
                { id: 'academyTieup', icon: 'fa-handshake', label: 'Academy Tie-up', badge: tieupBadge },
                { id: 'activityLogs', icon: 'fa-history', label: 'Activity Logs', badge: '' }
            ];

            const navItems = tabs.map(t => {
                const isActive = activeTab === t.id;
                const baseClass = "w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors mt-1";
                if (isActive) return `<div class="${baseClass} bg-brand-600 text-white shadow-lg"><i class="fas ${t.icon} w-5 text-center"></i> <span>${t.label}</span> ${t.badge}</div>`;
                return `<button onclick="navigateTo('${t.id}')" class="${baseClass} text-slate-400 hover:bg-white/5 hover:text-white"><i class="fas ${t.icon} w-5 text-center"></i> <span>${t.label}</span> ${t.badge}</button>`;
            }).join('');

            return `
                <div id="adminSidebar" class="w-64 bg-secondary-900 text-slate-300 flex-shrink-0 flex flex-col absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 z-50 sidebar-transition h-full border-r border-slate-800">
                    <div class="absolute inset-0 opacity-5" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>
                    <div class="p-6 border-b border-white/10 relative z-10 flex justify-between items-center">
                        <div class="flex items-center gap-3 text-white">
                            <div class="bg-brand-500 w-8 h-8 rounded flex items-center justify-center text-secondary-900"><i class="fas fa-chess-queen"></i></div>
                            <span class="font-bold text-lg tracking-wide">TitansAdmin</span>
                        </div>
                        <button onclick="toggleSidebar()" class="md:hidden text-white p-2"><i class="fas fa-times text-xl"></i></button>
                    </div>
                    <nav class="flex-grow p-4 space-y-1 relative z-10 overflow-y-auto">
                        <div class="px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Management</div>
                        ${navItems}
                    </nav>
                    <div class="p-4 border-t border-white/10 relative z-10">
                        <button onclick="handleLogout()" class="w-full px-4 py-2 border border-slate-700 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/50 text-slate-400 rounded-lg transition-all flex items-center justify-center gap-2"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            `;
        }

        // --- VIEW RENDERER ---
        function renderAdminDashboard(data) {
            const users = data.users || [];
            const tasks = data.tasks || [];
            const submissions = data.submissions || [];
            const settings = data.settings || {};
            const attendanceData = data.attendance || [];

            const currentTourAccess = String(settings.TournamentAccess || 'paid').trim().toLowerCase() === 'all' ? 'all' : 'paid';

            const taskSubmissions = submissions.filter(s => s.uploadType !== 'Exam');
            const pendingTaskSubmissions = taskSubmissions.filter(s => s.status === 'pending');

            const pendingUsers = users.filter(u => u.status === 'pending');
            const allStudents = users.filter(u => ['approved', 'blocked', 'expired', 'tieup', 'tieup_blocked'].includes(u.status) && u.role !== 'admin');
            const tieupCount = allStudents.filter(u => u.status === 'tieup' || u.status === 'tieup_blocked').length;
            const unrankedCount = allStudents.filter(u => (!u.level || u.level === 'Unranked') && u.status !== 'tieup' && u.status !== 'tieup_blocked').length;
            const initialCount = allStudents.filter(u => String(u.level || '').trim().toLowerCase() === 'initial').length;
            const expiredCount = users.filter(u => u.status === 'expired').length;
            const pendingCount = pendingUsers.length;
            const pendingAttCount = attendanceData.filter(a => a.status === 'pending').length;

            taskSubmissions.sort((a, b) => {
                const statusOrder = { 'pending': 1, 'incorrect': 2, 'correct': 3 };
                return (statusOrder[a.status] || 99) - (statusOrder[b.status] || 99);
            });

            const branchCards = ACADEMY_BRANCHES.map(b => {
                const count = allStudents.filter(u => u.branch === b).length;
                return `
                <div class="min-w-[200px] md:min-w-[240px] flex-shrink-0 snap-center bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-slate-500 text-[10px] font-bold uppercase tracking-wider">${b}</div>
                            <div class="text-2xl md:text-3xl font-bold text-indigo-500 mt-2">${count}</div>
                        </div>
                        <div class="bg-indigo-50 p-2 rounded-lg text-indigo-500"><i class="fas fa-map-marker-alt text-xl"></i></div>
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="glass-panel w-full max-w-6xl rounded-2xl overflow-hidden fade-in shadow-2xl flex flex-col h-full md:h-[90vh]">
                <div class="flex h-full relative">
                    ${getAdminSidebar('adminDashboard', unrankedCount, expiredCount, pendingCount, pendingAttCount, initialCount, tieupCount)}

                    <div id="sidebarOverlay" onclick="toggleSidebar()" class="absolute inset-0 bg-black/50 z-40 hidden md:hidden fade-in"></div>

                    <div class="flex-grow flex flex-col bg-slate-50 overflow-hidden w-full">
                        <header class="bg-white border-b border-slate-200 p-4 md:p-6 flex justify-between items-center sticky top-0 z-20">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-brand-600 p-2"><i class="fas fa-bars text-xl"></i></button>
                                <div><h2 class="text-lg md:text-2xl font-bold text-slate-800">Dashboard</h2></div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="refreshData()" class="text-brand-600 hover:bg-brand-50 px-3 py-1 rounded text-sm font-medium transition-colors"><i class="fas fa-sync-alt mr-1"></i> <span class="hidden md:inline">Refresh Data</span></button>
                            </div>
                        </header>

                        <div class="flex-grow p-4 md:p-8 overflow-y-auto">

                            <div class="flex flex-nowrap overflow-x-auto gap-4 md:gap-6 mb-6 pb-4 snap-x-mandatory">
                                <div class="min-w-[280px] md:min-w-[320px] flex-shrink-0 snap-center bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Pending Tasks</div>
                                            <div class="text-3xl md:text-4xl font-bold text-brand-500 mt-2">${pendingTaskSubmissions.length}</div>
                                        </div>
                                        <div class="bg-brand-50 p-2 rounded-lg text-brand-500"><i class="fas fa-video text-xl"></i></div>
                                    </div>
                                </div>
                                <div class="min-w-[280px] md:min-w-[320px] flex-shrink-0 snap-center bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Pending Admissions</div>
                                            <div class="text-3xl md:text-4xl font-bold text-orange-500 mt-2">${pendingCount}</div>
                                        </div>
                                        <div class="bg-orange-50 p-2 rounded-lg text-orange-500"><i class="fas fa-user-clock text-xl"></i></div>
                                    </div>
                                </div>
                                <div class="min-w-[280px] md:min-w-[320px] flex-shrink-0 snap-center bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Total Students</div>
                                            <div class="text-3xl md:text-4xl font-bold text-secondary-900 mt-2">${allStudents.length}</div>
                                        </div>
                                        <div class="bg-green-50 p-2 rounded-lg text-green-600"><i class="fas fa-user-graduate text-xl"></i></div>
                                    </div>
                                </div>
                                <div class="min-w-[280px] md:min-w-[320px] flex-shrink-0 snap-center bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">Active Tasks</div>
                                            <div class="text-3xl md:text-4xl font-bold text-slate-600 mt-2">${tasks.length}</div>
                                        </div>
                                        <div class="bg-blue-50 p-2 rounded-lg text-blue-600"><i class="fas fa-tasks text-xl"></i></div>
                                    </div>
                                </div>
                                ${branchCards}
                            </div>

                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 md:mb-8 overflow-hidden">
                                <div class="p-4 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-3 bg-brand-50">
                                    <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                                        <h3 class="font-bold text-brand-900 flex items-center gap-2 text-sm md:text-base whitespace-nowrap"><i class="fas fa-check-double"></i> Task Submissions</h3>
                                        <div class="relative flex-grow md:w-64">
                                            <input type="text" id="submissionSearch" onkeyup="filterSubmissions()" placeholder="Search submission name..." class="w-full pl-8 pr-4 py-1.5 text-xs rounded-full border border-slate-300 focus:border-brand-500 outline-none bg-white/80 focus:bg-white transition-all">
                                            <i class="fas fa-search absolute left-2.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                                        </div>
                                        <div class="w-full md:w-48">
                                            <select id="submissionFilter" onchange="filterSubmissions()" class="w-full text-xs rounded-full border border-slate-300 focus:border-brand-500 outline-none py-1.5 px-3 bg-white">
                                                <option value="all">All Status</option>
                                                <option value="correct">Correction Completed</option>
                                                <option value="pending">Pending Correction</option>
                                                <option value="incorrect">Redo Requested</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button onclick="handleDeleteAllSubmissions()" class="w-full md:w-auto bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded font-bold transition-colors shadow-sm"><i class="fas fa-trash-alt mr-1"></i> Delete All</button>
                                </div>
                                <div class="overflow-x-auto max-h-96">
                                    <table class="w-full text-left text-sm text-slate-600 min-w-[700px]">
                                        <thead class="bg-slate-50 text-slate-500 font-semibold uppercase text-xs tracking-wider sticky top-0">

        // --- FORM EVENT LISTENERS ---
        function attachEventListeners() {
            const taskForm = document.getElementById('addTaskForm');
            const settingsForm = document.getElementById('globalSettingsForm');
            const typeSelect = document.getElementById('taskType');
            const timeDiv = document.getElementById('solutionTimeDiv');

            if (typeSelect && timeDiv) {
                typeSelect.addEventListener('change', (e) => {
                    if (e.target.value === 'Solution') {
                        timeDiv.classList.remove('hidden');
                    } else {
                        timeDiv.classList.add('hidden');
                        document.getElementById('releaseTime').value = "";
                    }
                });
            }

            if (settingsForm) {
                settingsForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btnUpdateSettings');
                    const originalText = btn.innerHTML;
                    setButtonLoading(btn, true);
                    const tLink = document.getElementById('settingTourLink').value.trim();
                    const tVideo = document.getElementById('settingTourVideo').value.trim();
                    const tAccess = document.getElementById('settingTourAccess').value;
                    const tPin = document.getElementById('settingTourPin').value.trim();
                    const response = await updateSettingsAPI(tLink, tVideo, tAccess, tPin);
                    if (response && response.success) {
                        showToast('Global Settings Updated!', 'success');
                        await refreshData();
                    } else {
                        showToast((response && response.message) || 'Failed to update', 'error');
                        setButtonLoading(btn, false, originalText);
                    }
                });
            }

            if (taskForm) {
                taskForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('btnAddTask');
                    const originalText = btn.innerHTML;
                    btn.disabled = true;
                    btn.innerHTML = 'Publishing...';

                    const taskData = {
                        type: document.getElementById('taskType').value,
                        releaseTime: document.getElementById('releaseTime').value,
                        level: document.getElementById('taskLevel').value,
                        title: document.getElementById('taskTitle').value,
                        link: document.getElementById('taskLink').value
                    };

                    const response = await addTaskAPI(taskData);
                    if (response && response.success) {
                        showToast('Uploaded Successfully!', 'success');
                        await refreshData();
                    } else {
                        showToast((response && response.message) || 'Failed to upload', 'error');
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }
                });
            }
        }

        // --- STUDENT CALENDAR MODAL (MONTH & YEAR HISTORY) ---
        window.openStudentCalendar = function(studentUsername) {
            window.adminStudentCalUsername = studentUsername;
            const now = new Date();
            window.adminStudentCalDate = new Date(now.getFullYear(), now.getMonth(), 1);
            window.renderAdminStudentCalendarModal();
        };

        window.changeAdminStudentCalendarMonth = function(delta) {
            const cur = window.adminStudentCalDate || new Date();
            window.adminStudentCalDate = new Date(cur.getFullYear(), cur.getMonth() + delta, 1);
            window.renderAdminStudentCalendarModal();
        };

        window.changeAdminStudentCalendarYear = function(delta) {
            const cur = window.adminStudentCalDate || new Date();
            window.adminStudentCalDate = new Date(cur.getFullYear() + delta, cur.getMonth(), 1);
            window.renderAdminStudentCalendarModal();
        };

        window.resetAdminStudentCalendarToday = function() {
            const now = new Date();
            window.adminStudentCalDate = new Date(now.getFullYear(), now.getMonth(), 1);
            window.renderAdminStudentCalendarModal();
        };

        window.renderAdminStudentCalendarModal = function() {
            const studentUsername = window.adminStudentCalUsername;
            if (!studentUsername) return;

            const attendanceData = (window.cachedData && window.cachedData.attendance) || [];
            const studentAttendance = attendanceData.filter(a => a.username === studentUsername && a.status !== 'pending');

            const viewDate = window.adminStudentCalDate || new Date();
            const viewMonth = viewDate.getMonth();
            const viewYear = viewDate.getFullYear();

            const now = new Date();
            const isCurrentMonth = viewMonth === now.getMonth() && viewYear === now.getFullYear();

            const selectedMonthAttendance = studentAttendance.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getMonth() === viewMonth && d.getFullYear() === viewYear;
            });

            const selectedYearAttendance = studentAttendance.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getFullYear() === viewYear;
            });

            const attendanceByDay = {};
            selectedMonthAttendance.forEach(a => {
                const d = new Date(a.date);
                const day = d.getDate();
                attendanceByDay[day] = (attendanceByDay[day] || 0) + 1;
            });

            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const monthName = viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            const shortMonth = viewDate.toLocaleString('default', { month: 'short' });

            let gridHtml = '';
            const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            dayNames.forEach(d => gridHtml += `<div class="text-center text-[10px] font-bold text-slate-400 pb-1">${d}</div>`);

            for (let i = 0; i < firstDay; i++) gridHtml += `<div></div>`;

            for (let day = 1; day <= daysInMonth; day++) {
                const marksCount = attendanceByDay[day] || 0;
                let marksHtml = '';
                for (let m = 0; m < Math.min(marksCount, 3); m++) marksHtml += `<span class="calendar-mark"></span>`;
                if (marksCount > 3) marksHtml += `<span class="text-[8px] font-bold text-emerald-600 ml-0.5">+${marksCount - 3}</span>`;

                const fullDateLabel = new Date(viewYear, viewMonth, day).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                const titleAttr = marksCount > 0 ? `${fullDateLabel} - Attended (${marksCount} ${marksCount > 1 ? 'classes' : 'class'})` : fullDateLabel;
                const isAttended = marksCount > 0 ? 'attended shadow-sm' : 'bg-slate-50 text-slate-400';

                gridHtml += `
                    <div class="calendar-day ${isAttended} relative" title="${escapeAttr(titleAttr)}">
                        <span>${day}</span>
                        ${marksCount > 0 ? `<div class="flex flex-wrap justify-center mt-1 w-full px-1 items-center">${marksHtml}</div>` : ''}
                    </div>
                `;
            }

            const attendedDaysSorted = Object.keys(attendanceByDay).map(Number).sort((a, b) => a - b);
            const attendedDatesHtml = attendedDaysSorted.length > 0
                ? attendedDaysSorted.map(day => {
                    const count = attendanceByDay[day];
                    const dateBadge = `${shortMonth} ${day}, ${viewYear}${count > 1 ? ` (${count}x)` : ''}`;
                    return `<span class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded text-[11px] font-bold">${dateBadge}</span>`;
                }).join('')
                : `<span class="text-xs text-slate-400 italic">No attendance recorded for ${monthName}.</span>`;

            const existingModal = document.getElementById('studentCalendarModal');
            if (existingModal) existingModal.remove();

            const modalHtml = `
                <div id="studentCalendarModal" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-brand-600 p-4 flex justify-between items-center text-white flex-shrink-0">
                            <h3 class="font-bold text-lg truncate pr-2"><i class="fas fa-user mr-2"></i> ${studentUsername}</h3>
                            <button onclick="document.getElementById('studentCalendarModal').remove()" class="text-brand-100 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="changeAdminStudentCalendarYear(-1)" title="Previous Year" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-angle-double-left"></i></button>
                                    <button type="button" onclick="changeAdminStudentCalendarMonth(-1)" title="Previous Month" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-chevron-left"></i></button>
                                </div>
                                <div class="text-center font-bold text-slate-700 text-base md:text-lg">${monthName}</div>
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="changeAdminStudentCalendarMonth(1)" title="Next Month" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-chevron-right"></i></button>
                                    <button type="button" onclick="changeAdminStudentCalendarYear(1)" title="Next Year" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-angle-double-right"></i></button>
                                </div>
                            </div>
                            ${!isCurrentMonth ? `
                            <div class="text-center mb-3">
                                <button type="button" onclick="resetAdminStudentCalendarToday()" class="text-[11px] font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-full border border-emerald-200 transition-colors">
                                    <i class="fas fa-undo mr-1"></i> Back to Current Month
                                </button>
                            </div>
                            ` : ''}
                            <div class="calendar-grid">
                                ${gridHtml}
                            </div>
                            <div class="mt-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-2"><i class="fas fa-calendar-day text-emerald-500 mr-1"></i> Attended Dates (${monthName})</div>
                                <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
                                    ${attendedDatesHtml}
                                </div>
                            </div>
                            <div class="mt-4 flex flex-col gap-2">
                                <div class="text-center text-sm text-slate-500 bg-slate-50 py-2 rounded-lg border border-slate-100">
                                    Classes Attended (${monthName}): <b class="text-emerald-600">${selectedMonthAttendance.length}</b>
                                </div>
                                <div class="text-center text-xs text-slate-400 bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                                    Total Classes in ${viewYear}: <b class="text-slate-600">${selectedYearAttendance.length}</b>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = modalHtml;
            document.getElementById('global-modals').appendChild(tempDiv.firstElementChild);
        };

        // --- NAVIGATION & SIDEBAR ---
        window.navigateTo = function(viewName) {
            if (ROUTES[viewName]) {
                window.location.href = ROUTES[viewName];
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar || !overlay) return;
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        window.handleLogout = function() {
            window.currentUser = null;
            sessionStorage.removeItem('cta_session_user');
            showToast('Logged out', 'info');
            setTimeout(() => {
                window.location.href = ROUTES.login;
            }, 300);
        };

        // --- FILTERS ---
        window.filterSubmissions = function() {
            const input = document.getElementById("submissionSearch");
            const filterText = input ? input.value.toUpperCase() : "";
            const dropdown = document.getElementById("submissionFilter");
            const filterStatus = dropdown ? dropdown.value : "all";
            const tableBody = document.getElementById("submissionTableBody");
            if (!tableBody) return;
            const tr = tableBody.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                const tdName = tr[i].getElementsByTagName("td")[0];
                const rowStatus = tr[i].getAttribute("data-status");
                if (tdName && rowStatus) {
                    const txtValue = tdName.textContent || tdName.innerText;
                    const matchesText = txtValue.toUpperCase().indexOf(filterText) > -1;
                    let matchesStatus = true;
                    if (filterStatus !== 'all') {
                        if (filterStatus === 'pending' && rowStatus !== 'pending') matchesStatus = false;
                        if (filterStatus === 'correct' && rowStatus !== 'correct') matchesStatus = false;
                        if (filterStatus === 'incorrect' && rowStatus !== 'incorrect') matchesStatus = false;
                    }
                    tr[i].style.display = (matchesText && matchesStatus) ? "" : "none";
                }
            }
        };

        window.filterRoster = function() {
            const input = document.getElementById("rosterSearch");
            const filterText = input ? input.value.toUpperCase() : "";
            const dropdown = document.getElementById("rosterFilter");
            const filterLevel = dropdown ? dropdown.value : "all";
            const tableBody = document.getElementById("rosterTableBody");
            if (!tableBody) return;
            const tr = tableBody.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                const tdName = tr[i].getElementsByTagName("td")[0];
                const tdLevelCell = tr[i].getElementsByTagName("td")[4];
                const tdLevelSelect = tdLevelCell ? tdLevelCell.getElementsByTagName("select")[0] : null;
                if (tdName && tdLevelSelect) {
                    const txtValue = tdName.textContent || tdName.innerText;
                    const rowLevel = tdLevelSelect.value;
                    const matchesText = txtValue.toUpperCase().indexOf(filterText) > -1;
                    let matchesLevel = true;
                    if (filterLevel !== 'all' && rowLevel !== filterLevel) matchesLevel = false;
                    tr[i].style.display = (matchesText && matchesLevel) ? "" : "none";
                }
            }
        };

        // --- ACTION HANDLERS ---
        window.handleUserFeeUpdate = async function(username, feeAmount, inputElement) {
            if (!feeAmount) return;
            inputElement.disabled = true;
            inputElement.classList.add('opacity-50', 'cursor-wait');
            showToast(`Saving fee for ${username}...`, 'info');
            const response = await updateUserFeeAPI(username, feeAmount);
            inputElement.disabled = false;
            inputElement.classList.remove('opacity-50', 'cursor-wait');
            if (response && response.success) showToast(`Fee Updated: Rs ${feeAmount}`, 'success');
            else showToast('Failed to update fee', 'error');
        };

        window.handleBranchUpdate = async function(username, newBranch, selectElement) {
            const originalValue = selectElement.getAttribute('data-prev') || '';
            selectElement.disabled = true;
            selectElement.classList.add('opacity-50', 'cursor-wait');
            showToast(`Assigning branch to ${newBranch || 'None'}...`, 'info');
            const response = await updateBranchAPI(username, newBranch);
            selectElement.disabled = false;
            selectElement.classList.remove('opacity-50', 'cursor-wait');
            if (response && response.success) {
                showToast(`Branch updated`, 'success');
                selectElement.setAttribute('data-prev', newBranch);
                await refreshData(false);
            } else {
                showToast('Failed to save branch', 'error');
                selectElement.value = originalValue;
            }
        };

        window.handleStatusUpdate = async function(username, newStatus, selectElement) {
            const originalValue = selectElement.getAttribute('data-prev');
            selectElement.disabled = true;
            selectElement.classList.add('opacity-50', 'cursor-wait');
            let message = "Updating status...";
            if (newStatus === 'blocked') message = "Blocking user...";
            if (newStatus === 'expired') message = "Expiring user...";
            if (newStatus === 'approved') message = "Activating user...";
            if (newStatus === 'tieup') message = "Assigning Academy Tie Up...";
            if (newStatus === 'tieup_blocked') message = "Blocking Academy Tie Up...";
            showToast(message, 'info');
            const response = await updateUserStatusAPI(username, newStatus);
            selectElement.disabled = false;
            selectElement.classList.remove('opacity-50', 'cursor-wait');
            if (response && response.success) {
                showToast(`Status updated to ${newStatus}`, 'success');
                selectElement.setAttribute('data-prev', newStatus);
                await refreshData(false);
            } else {
                showToast('Failed to update status', 'error');
                selectElement.value = originalValue;
            }
        };

        window.handleLevelUpdate = async function(username, newLevel, selectElement) {
            const originalValue = selectElement.getAttribute('data-prev') || 'Unranked';
            selectElement.disabled = true;
            selectElement.classList.add('opacity-50', 'cursor-wait');
            showToast(`Assigning ${newLevel}...`, 'info');
            const response = await updateUserLevelAPI(username, newLevel);
            selectElement.disabled = false;
            selectElement.classList.remove('opacity-50', 'cursor-wait');
            if (response && response.success) {
                showToast(`Rank updated to ${newLevel}`, 'success');
                selectElement.setAttribute('data-prev', newLevel);
                await refreshData(false);
            } else {
                showToast('Failed to save rank', 'error');
                selectElement.value = originalValue;
            }
        };

        window.handleDateUpdate = async function(username, type, value, inputElement) {
            inputElement.disabled = true;
            inputElement.classList.add('opacity-50', 'cursor-wait');
            showToast(`Saving ${type}...`, 'info');
            let isoValue = "";
            if (value) {
                const dateObj = new Date(value);
                isoValue = dateObj.toISOString();
            }
            const response = await updateUserDatesAPI(username, type, isoValue);
            inputElement.disabled = false;
            inputElement.classList.remove('opacity-50', 'cursor-wait');
            if (response && response.success) {
                showToast(`${type} Saved`, 'success');
                await refreshData(false);
            } else {
                showToast('Failed to save date', 'error');
            }
        };

        window.handleDeleteTask = async function(id, btn) {
            if (!confirm('Delete this upload?')) return;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            const response = await deleteTaskAPI(id);
            if (response && response.success) {
                showToast('Deleted', 'success');
                await refreshData(false);
            } else {
                showToast((response && response.message) || 'Error deleting', 'error');
                btn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            }
        };

        window.handleSubmissionGrade = async function(id, status, btn) {
            const remarkInput = document.getElementById(`remark-${id}`);
            const remarks = remarkInput ? remarkInput.value : "";
            const parentDiv = btn.parentElement;
            const buttons = parentDiv.getElementsByTagName('button');
            for (let b of buttons) b.disabled = true;
            showToast(`Marking as ${status}...`, 'info');
            const response = await updateSubmissionStatusAPI(id, status, remarks);
            if (response && response.success) {
                showToast('Status & Remarks Updated', 'success');
                await refreshData(false);
            } else {
                showToast('Update failed', 'error');
                for (let b of buttons) b.disabled = false;
            }
        };

        window.handleDeleteSubmission = async function(id, btn) {
            if (!confirm("Permanently delete this submission?")) return;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            const response = await deleteSubmissionAPI(id);
            if (response && response.success) {
                showToast('Submission Deleted', 'success');
                await refreshData(false);
            } else {
                showToast('Delete failed', 'error');
                btn.innerHTML = '<i class="fas fa-trash"></i>';
            }
        };

        window.handleDeleteUser = async function(username, btn) {
            const password = prompt("SECURITY CHECK:\nEnter Admin Password to delete student '" + username + "':");
            if (!password) return;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;
            const users = await fetchUsers();
            const admin = Array.isArray(users) ? users.find(u => u.role === 'admin') : null;
            if (admin && String(admin.password) === String(password)) {
                if (confirm("Are you sure you want to permanently delete " + username + "?")) {
                    const response = await deleteUserAPI(username);
                    if (response && response.success) {
                        showToast('Student deleted', 'success');
                        await refreshData(false);
                    } else {
                        showToast((response && response.message) || 'Delete failed', 'error');
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                    }
                } else {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }
            } else {
                showToast('Incorrect Admin Password', 'error');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        };

        window.handleDeleteAllSubmissions = async function() {
            const pass = prompt("ADMIN SECURITY CHECK:\nEnter Admin Password to delete ALL Task submissions:");
            if (!pass) return;
            const users = await fetchUsers();
            const admin = Array.isArray(users) ? users.find(u => u.role === 'admin') : null;
            if (!admin || String(pass) !== String(admin.password)) { alert("ACCESS DENIED."); return; }
            if (!confirm("Are you sure?")) return;
            const submissions = await fetchSubmissions();
            const tasksToDelete = submissions.filter(s => s.uploadType !== 'Exam');
            if (tasksToDelete.length === 0) { alert("No submissions found."); return; }
            showToast(`Deleting...`, "info");
            try {
                const deletePromises = tasksToDelete.map(s => deleteSubmissionAPI(s.id));
                await Promise.all(deletePromises);
                showToast("Submissions deleted.", "success");
                await refreshData(false);
            } catch (err) {
                alert("Error deleting.");
                await refreshData(false);
            }
        };

        window.handleDeleteAllTasks = async function() {
            const pass = prompt("ADMIN SECURITY CHECK:\nEnter Admin Password to delete ALL active tasks:");
            if (!pass) return;
            const users = await fetchUsers();
            const admin = Array.isArray(users) ? users.find(u => u.role === 'admin') : null;
            if (!admin || String(pass) !== String(admin.password)) { alert("ACCESS DENIED."); return; }
            if (!confirm("Are you sure?")) return;
            const tasks = await fetchTasks();
            if (tasks.length === 0) { alert("No tasks found."); return; }
            showToast(`Deleting...`, "info");
            try {
                const deletePromises = tasks.map(t => deleteTaskAPI(t.id));
                await Promise.all(deletePromises);
                showToast("Tasks deleted.", "success");
                await refreshData(false);
            } catch (err) {
                alert("Error deleting.");
                await refreshData(false);
            }
        };

        // --- DATA LOADER & SESSION GUARD ---
        async function loadAdminDashboard(showLoader = true, showRefreshToast = false) {
            const rawSession = sessionStorage.getItem('cta_session_user');
            if (!rawSession) {
                window.location.href = ROUTES.login;
                return;
            }

            let sessionUser;
            try {
                sessionUser = JSON.parse(rawSession);
            } catch (e) {
                sessionStorage.removeItem('cta_session_user');
                window.location.href = ROUTES.login;
                return;
            }

            if (sessionUser.role !== 'admin') {
                window.location.href = sessionUser.status === 'tieup' ? ROUTES.adminAttendance : ROUTES.student;
                return;
            }

            window.currentUser = sessionUser;
            const app = document.getElementById('app');

            if (showLoader) {
                app.innerHTML = `
                    <div class="text-brand-600 font-bold flex flex-col items-center">
                        <div class="loader mb-2 w-8 h-8 border-4"></div>
                        Connecting to Academy Server...
                    </div>
                `;
            }

            try {
                const [users, tasks, submissions, settings, attendance] = await Promise.all([
                    fetchUsers(),
                    fetchTasks(),
                    fetchSubmissions(),
                    fetchSettings(),
                    fetchAttendance()
                ]);

                if (!Array.isArray(users)) {
                    app.innerHTML = `
                        <div class="glass-panel rounded-xl p-8 text-center max-w-md mx-auto">
                            <i class="fas fa-wifi text-3xl text-red-500 mb-3"></i>
                            <h2 class="font-bold text-lg text-slate-800 mb-2">Connection Error</h2>
                            <p class="text-slate-500 text-sm mb-4">Unable to reach Academy Server. Please check your connection and try again.</p>
                            <button onclick="loadAdminDashboard(true, false)" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition-colors">Retry</button>
                        </div>
                    `;
                    return;
                }

                window.cachedData = {
                    users: users || [],
                    tasks: tasks || [],
                    submissions: submissions || [],
                    settings: settings || {},
                    attendance: attendance || []
                };

                app.innerHTML = renderAdminDashboard(window.cachedData);
                attachEventListeners();

                if (showRefreshToast) {
                    showToast("Data Refreshed", "info");
                }
            } catch (err) {
                console.error('loadAdminDashboard error:', err);
                showToast('Failed to load dashboard', 'error');
            }
        }

        window.refreshData = async function(notify = true) {
            await loadAdminDashboard(false, notify);
        };

        // Start Admin Dashboard
        loadAdminDashboard(true, false);
    </script>
</body>
</html>
