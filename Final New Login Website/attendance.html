<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Titans Academy - Student Attendance</title>
    <link rel="icon" href="images/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="cta-loader.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], },
                    colors: {
                        brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12', },
                        secondary: { 900: '#1a1a1a', 800: '#262626', }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fff7ed;
            background-image: linear-gradient(rgba(249, 115, 22, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            height: 100vh; height: 100dvh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.1);
            box-shadow: 0 20px 25px -5px rgba(234, 88, 12, 0.1), 0 8px 10px -6px rgba(234, 88, 12, 0.1);
        }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #ea580c;
            width: 20px; height: 20px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Animation for Dancing Robot */
        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-4px) rotate(-15deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-4px) rotate(15deg); }
        }
        .animate-dance {
            animation: dance 1s ease-in-out infinite;
            transform-origin: bottom center;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .snap-x-mandatory { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        /* Custom Calendar Grid */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #f1f5f9; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;}
        .calendar-day.attended { background-color: #ecfdf5; border-color: #10b981; color: #065f46; }
        .calendar-day.pending { background-color: #fffbeb; border-color: #f59e0b; color: #b45309; }
        .calendar-day.admin-interactive:hover { border-color: #10b981; background-color: #f0fdf4; }
        .calendar-mark { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #10b981; margin: 1px; }
        .calendar-mark-pending { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #f59e0b; margin: 1px; }
    </style>
</head>
<body class="antialiased text-slate-800 flex flex-col overflow-hidden">

    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4 md:px-0 ml-auto"></div>

    <div id="app" class="flex-grow flex items-center justify-center p-4 w-full h-full relative">
        <div class="text-brand-600 font-bold flex flex-col items-center">
            <div class="loader mb-2 w-8 h-8 border-4"></div>
            Connecting to Academy Server...
        </div>
    </div>

    <div id="global-modals"></div>

    <script>
        // --- API & ROUTE CONFIGURATION ---
        const API_URL = 'https://script.google.com/macros/s/AKfycbwIRGaR75isLAnfazJciZ-YWIk_GHJK-MPcV0TZwlLkoUEJvc1LQ1GKpAiYxoMlXYy1PQ/exec';

        const ROUTES = {
            login: 'index.html',
            student: 'student.html',
            adminDashboard: 'admin.html',
            unrankedStudents: 'unranked.html',
            expiredStudents: 'expired.html',
            pendingStudents: 'pending.html',
            adminAttendance: 'attendance.html',
            initialStudents: 'initial.html',
            attendanceApproval: 'attendance-approval.html',
            adminExams: 'exams.html',
            puzzleBooks: 'puzzle-books.html',
            academyTieup: 'tieup.html',
            activityLogs: 'activity-logs.html'
        };

        const ACADEMY_BRANCHES = [
            'Noombal Branch',
            'Iyyappanthangal Branch',
            'Poonamallee Branch',
            'Mangadu Branch',
            'Online Batch'
        ];

        function escapeJs(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function escapeAttr(str) {
            const amp = String.fromCharCode(38);
            return String(str || '')
                .replace(/&/g, amp + 'amp;')
                .replace(/"/g, amp + 'quot;')
                .replace(/</g, amp + 'lt;')
                .replace(/>/g, amp + 'gt;');
        }

        const initNow = new Date();
        window.currentUser = null;
        window.cachedData = null;
        window.tempAttendanceList = [];
        window.currentAdminCalendarDate = new Date(initNow.getFullYear(), initNow.getMonth(), 1);
        window.reportCalendarDate = new Date(initNow.getFullYear(), initNow.getMonth(), 1);
        window.studentCalModalUsername = null;
        window.studentCalModalDate = new Date(initNow.getFullYear(), initNow.getMonth(), 1);

        // --- DATA MANAGEMENT ---
        async function fetchUsers() { try { return await (await fetch(`${API_URL}?action=getUsers`)).json(); } catch (e) { return null; } }
        async function fetchAttendance() { try { return await (await fetch(`${API_URL}?action=getAttendance`)).json(); } catch (e) { return []; } }

        async function saveAttendanceAPI(records) { return await sendPostRequest({ action: 'saveAttendance', data: records }); }
        async function deleteAttendanceAPI(date, username) { return await sendPostRequest({ action: 'deleteAttendance', data: { date, username } }); }

        async function sendPostRequest(data) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (err) {
                    return { success: false, message: "Server response was invalid or timed out." };
                }
            } catch (error) {
                return { success: false, message: error.message };
            }
        }

        // --- UI UTILITIES ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white border-l-4 border-emerald-800',
                error: 'bg-red-500 text-white border-l-4 border-red-800',
                info: 'bg-brand-600 text-white border-l-4 border-brand-800'
            };
            const icons = {
                success: '<i class="fas fa-check-circle mr-2"></i>',
                error: '<i class="fas fa-exclamation-triangle mr-2"></i>',
                info: '<i class="fas fa-info-circle mr-2"></i>'
            };
            toast.className = `${colors[type]} px-4 py-3 md:px-6 md:py-4 rounded shadow-2xl transform transition-all duration-300 translate-x-full pointer-events-auto flex items-center font-medium text-sm md:text-base`;
            toast.innerHTML = `${icons[type]} <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function setButtonLoading(btn, isLoading, text = "") {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<div class="loader inline-block mr-2 border-white border-t-transparent w-4 h-4"></div> Processing...`;
            } else {
                btn.disabled = false;
                btn.innerHTML = text;
            }
        }

        // --- SIDEBAR GENERATOR ---
        function getAdminSidebar(activeTab, unrankedCount, expiredCount, pendingCount, pendingAttCount = 0, initialCount = 0, tieupCount = 0) {
            const expiredBadge = expiredCount > 0 ? `<span class="ml-auto bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${expiredCount}</span>` : '';
            const pendingBadge = pendingCount > 0 ? `<span class="ml-auto bg-orange-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${pendingCount}</span>` : '';
            const unrankedBadge = unrankedCount > 0 ? `<span class="ml-auto bg-brand-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${unrankedCount}</span>` : '';
            const initialBadge = initialCount > 0 ? `<span class="ml-auto bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${initialCount}</span>` : '';
            const attBadge = pendingAttCount > 0 ? `<span class="ml-auto bg-blue-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${pendingAttCount}</span>` : '';
            const tieupBadge = tieupCount > 0 ? `<span class="ml-auto bg-indigo-500 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm">${tieupCount}</span>` : '';

            const isTieUp = window.currentUser && window.currentUser.status === 'tieup';

            let tabs = [
                { id: 'adminDashboard', icon: 'fa-users-cog', label: 'Dashboard', badge: '' },
                { id: 'unrankedStudents', icon: 'fa-user-tag', label: 'Unranked Students', badge: unrankedBadge },
                { id: 'expiredStudents', icon: 'fa-clock', label: 'Plan Expired Students', badge: expiredBadge },
                { id: 'pendingStudents', icon: 'fa-user-clock', label: 'Pending Students', badge: pendingBadge },
                { id: 'adminAttendance', icon: 'fa-calendar-check', label: 'Student Attendance', badge: '' }
            ];

            if (!isTieUp) {
                tabs.push({ id: 'initialStudents', icon: 'fa-chess-pawn', label: 'Initial Grade Students', badge: initialBadge });
                tabs.push({ id: 'attendanceApproval', icon: 'fa-check-double', label: 'Attendance Approval', badge: attBadge });
                tabs.push({ id: 'adminExams', icon: 'fa-file-signature', label: 'Manage Exams', badge: '' });
                tabs.push({ id: 'puzzleBooks', icon: 'fa-book-open', label: 'Puzzle Book Upload', badge: '' });
                tabs.push({ id: 'academyTieup', icon: 'fa-handshake', label: 'Academy Tie-up', badge: tieupBadge });
                tabs.push({ id: 'activityLogs', icon: 'fa-history', label: 'Activity Logs', badge: '' });
            } else {
                tabs = [
                    { id: 'adminAttendance', icon: 'fa-calendar-check', label: 'Student Attendance', badge: '' }
                ];
            }

            const navItems = tabs.map(t => {
                const isActive = activeTab === t.id;
                const baseClass = "w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors mt-1";
                if (isActive && t.id === 'adminAttendance') return `<div class="${baseClass} bg-emerald-600 text-white shadow-lg"><i class="fas ${t.icon} w-5 text-center"></i> <span>${t.label}</span> ${t.badge}</div>`;
                if (isActive) return `<div class="${baseClass} bg-brand-600 text-white shadow-lg"><i class="fas ${t.icon} w-5 text-center"></i> <span>${t.label}</span> ${t.badge}</div>`;
                return `<button onclick="navigateTo('${t.id}')" class="${baseClass} text-slate-400 hover:bg-white/5 hover:text-white"><i class="fas ${t.icon} w-5 text-center"></i> <span>${t.label}</span> ${t.badge}</button>`;
            }).join('');

            return `
                <div id="adminSidebar" class="w-64 bg-secondary-900 text-slate-300 flex-shrink-0 flex flex-col absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 z-50 sidebar-transition h-full border-r border-slate-800">
                    <div class="absolute inset-0 opacity-5" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>
                    <div class="p-6 border-b border-white/10 relative z-10 flex justify-between items-center">
                        <div class="flex items-center gap-3 text-white">
                            <div class="bg-brand-500 w-8 h-8 rounded flex items-center justify-center text-secondary-900"><i class="fas fa-chess-queen"></i></div>
                            <span class="font-bold text-lg tracking-wide">${isTieUp ? 'PartnerAdmin' : 'TitansAdmin'}</span>
                        </div>
                        <button onclick="toggleSidebar()" class="md:hidden text-white p-2"><i class="fas fa-times text-xl"></i></button>
                    </div>
                    <nav class="flex-grow p-4 space-y-1 relative z-10 overflow-y-auto">
                        <div class="px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Management</div>
                        ${navItems}
                    </nav>
                    <div class="p-4 border-t border-white/10 relative z-10">
                        <button onclick="handleLogout()" class="w-full px-4 py-2 border border-slate-700 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/50 text-slate-400 rounded-lg transition-all flex items-center justify-center gap-2"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            `;
        }

        // --- VIEW RENDERER ---
        function renderAdminAttendance(data, savedDateVal = '', savedBranchVal = '') {
            const users = data.users || [];
            const attendanceData = data.attendance || [];
            const allStudents = users.filter(u => ['approved', 'blocked', 'expired', 'tieup'].includes(u.status) && u.role !== 'admin');
            const unrankedCount = allStudents.filter(u => !u.level || u.level === 'Unranked').length;
            const initialCount = allStudents.filter(u => String(u.level || '').trim().toLowerCase() === 'initial').length;
            const tieupCount = users.filter(u => u.status === 'tieup' && u.role !== 'admin').length;
            const expiredCount = users.filter(u => u.status === 'expired').length;
            const pendingCount = users.filter(u => u.status === 'pending').length;
            const pendingAttCount = attendanceData.filter(a => a.status === 'pending').length;

            const isTieUp = window.currentUser && window.currentUser.status === 'tieup';
            let tieUpBranch = '';
            if (isTieUp) tieUpBranch = window.currentUser.branch || '';

            return `
            <div class="glass-panel w-full max-w-6xl rounded-2xl overflow-hidden fade-in shadow-2xl flex flex-col h-full md:h-[90vh]">
                <div class="flex h-full relative">
                    ${getAdminSidebar('adminAttendance', unrankedCount, expiredCount, pendingCount, pendingAttCount, initialCount, tieupCount)}
                    <div id="sidebarOverlay" onclick="toggleSidebar()" class="absolute inset-0 bg-black/50 z-40 hidden md:hidden fade-in"></div>
                    <div class="flex-grow flex flex-col bg-slate-50 overflow-hidden w-full">
                        <header class="bg-white border-b border-slate-200 p-4 md:p-6 flex justify-between items-center sticky top-0 z-20">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-emerald-600 p-2"><i class="fas fa-bars text-xl"></i></button>
                                <div><h2 class="text-lg md:text-2xl font-bold text-emerald-800">Student Attendance Tracker</h2></div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="refreshData()" class="text-emerald-600 hover:bg-emerald-50 px-3 py-1 rounded text-sm font-medium transition-colors"><i class="fas fa-sync-alt mr-1"></i> <span class="hidden md:inline">Refresh</span></button>
                            </div>
                        </header>

                        <div class="flex-grow p-4 md:p-8 overflow-y-auto flex flex-col md:flex-row gap-6 items-start">

                            <div class="w-full md:w-1/2 flex flex-col gap-4">
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                                    <div class="mb-4">
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"><i class="fas fa-calendar-alt text-emerald-500 mr-1"></i> Select Class Date</label>
                                        <input type="date" id="attendanceDate" value="${savedDateVal}" class="w-full border border-slate-200 focus:border-emerald-500 rounded-lg p-2 text-sm outline-none transition-colors shadow-inner">
                                    </div>

                                    <div class="mb-4">
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1"><i class="fas fa-map-marker-alt text-emerald-500 mr-1"></i> Select Branch</label>
                                        <select id="attendanceBranch" onchange="renderAttendanceStudents()" class="w-full border border-slate-200 focus:border-emerald-500 rounded-lg p-2 text-sm outline-none transition-colors shadow-inner" ${isTieUp ? 'disabled' : ''}>
                                            ${isTieUp ? `<option value="${tieUpBranch}" selected>${tieUpBranch || 'No Branch Assigned'}</option>` : '<option value="">Choose Branch to load students...</option>' + ACADEMY_BRANCHES.map(b => `<option value="${b}" ${savedBranchVal === b ? 'selected' : ''}>${b}</option>`).join('')}
                                        </select>
                                    </div>

                                    <div class="relative w-full">
                                        <input type="text" id="attendanceSearch" onkeyup="renderAttendanceStudents()" placeholder="Search student name..." class="w-full pl-9 pr-4 py-2 text-sm rounded-full border border-slate-200 focus:border-emerald-500 outline-none transition-colors shadow-sm">
                                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                                    </div>
                                </div>

                                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col max-h-[400px]">
                                    <h3 class="font-bold text-slate-700 text-sm mb-2 border-b border-slate-100 pb-2">Select to Add <span class="text-xs text-slate-400 font-normal ml-1">(Can select same student 2x if 2 hours)</span></h3>
                                    <div id="attendanceStudentList" class="flex flex-col gap-1 overflow-y-auto flex-grow pr-1">
                                        <div class="text-xs text-slate-400 italic text-center py-4">Select a branch above to view students.</div>
                                    </div>

                                    <button onclick="toggleAttendanceReport()" id="btnToggleAttReport" class="mt-4 w-full bg-slate-800 text-white font-bold py-2 rounded-lg hover:bg-slate-900 transition-colors shadow-sm flex items-center justify-center gap-2">
                                        <i class="fas fa-chart-pie"></i> Show Attendance Report
                                    </button>
                                </div>
                            </div>

                            <div class="w-full md:w-1/2 flex flex-col gap-4 sticky top-0">
                                <div class="bg-white p-5 rounded-xl shadow-md border-2 border-emerald-100 flex flex-col h-[500px]">
                                    <div class="flex justify-between items-center border-b-2 border-emerald-50 pb-3 mb-4">
                                        <h3 id="rightPanelTitle" class="font-bold text-emerald-800"><i class="fas fa-clipboard-check text-emerald-500 mr-1"></i> Pending Upload List</h3>
                                        <span id="attendanceCount" class="bg-emerald-500 text-white px-2 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
                                    </div>

                                    <div id="pendingAttendanceList" class="flex-grow overflow-y-auto flex flex-col gap-2 pr-1 pb-4">
                                        <div class="text-xs text-slate-400 italic text-center py-8">
                                            <i class="fas fa-arrow-left text-2xl text-slate-200 mb-2 block"></i>
                                            Click students on the left to add them to this attendance batch.
                                        </div>
                                    </div>

                                    <div id="attendanceReportList" class="flex-grow overflow-y-auto hidden flex-col gap-2 pr-1 pb-4">
                                    </div>

                                    <div class="flex flex-col gap-2 mt-auto">
                                        <button onclick="submitAttendance()" id="btnSubmitAttendance" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center gap-2">
                                            <i class="fas fa-cloud-upload-alt"></i> Save Attendance Batch
                                        </button>
                                    </div>
                                </div>
                                <div class="mt-2 border-t border-slate-200 pt-4">
                                    <button onclick="openAdminSavedCalendar()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-all shadow-sm flex justify-center items-center gap-2 border border-slate-300">
                                        <i class="fas fa-calendar-alt"></i> View Saved Attendance
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        // --- ATTENDANCE FUNCTIONS ---
        window.renderAttendanceStudents = function() {
            const isTieUp = window.currentUser && window.currentUser.status === 'tieup';
            const branchEl = document.getElementById('attendanceBranch');
            const searchEl = document.getElementById('attendanceSearch');
            const listEl = document.getElementById('attendanceStudentList');
            if (!listEl || !branchEl) return;

            let branch = branchEl.value;
            if (isTieUp) branch = window.currentUser.branch || '';

            const search = searchEl ? searchEl.value.toLowerCase() : '';

            if (!branch) {
                listEl.innerHTML = '<div class="text-xs text-slate-400 italic text-center py-4">Select a branch above to view students.</div>';
                return;
            }

            const users = (window.cachedData && window.cachedData.users) || [];
            // Exclude admin and tieup accounts from being marked for attendance
            const students = users.filter(u => u.role !== 'admin' && ['approved', 'blocked', 'expired'].includes(u.status) && u.branch === branch);
            const filtered = students.filter(u => String(u.username).toLowerCase().includes(search));

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="text-xs text-slate-400 italic text-center py-4">No students found matching your criteria.</div>';
                return;
            }

            listEl.innerHTML = filtered.map(u => {
                const safeName = escapeJs(u.username);
                return `
                <div class="flex justify-between items-center p-3 hover:bg-emerald-50 rounded-lg border border-transparent hover:border-emerald-200 transition-colors cursor-pointer group shadow-sm bg-slate-50 mb-1" onclick="addStudentToAttendance('${safeName}')">
                    <span class="text-sm font-bold text-slate-700 group-hover:text-emerald-700">${u.username}</span>
                    <button type="button" class="text-emerald-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fas fa-plus-circle text-lg"></i></button>
                </div>
            `;
            }).join('');

            // If Monthly Report is currently open, refresh it automatically when branch changes
            const reportList = document.getElementById('attendanceReportList');
            if (reportList && !reportList.classList.contains('hidden')) {
                populateAttendanceReport();
            }
        };

        window.changeReportMonth = function(delta) {
            const cur = window.reportCalendarDate || new Date();
            window.reportCalendarDate = new Date(cur.getFullYear(), cur.getMonth() + delta, 1);
            populateAttendanceReport();
        };

        window.changeReportYear = function(delta) {
            const cur = window.reportCalendarDate || new Date();
            window.reportCalendarDate = new Date(cur.getFullYear() + delta, cur.getMonth(), 1);
            populateAttendanceReport();
        };

        window.resetReportMonthToday = function() {
            const now = new Date();
            window.reportCalendarDate = new Date(now.getFullYear(), now.getMonth(), 1);
            populateAttendanceReport();
        };

        function populateAttendanceReport() {
            const reportList = document.getElementById('attendanceReportList');
            const countEl = document.getElementById('attendanceCount');
            const branchEl = document.getElementById('attendanceBranch');
            if (!reportList || !countEl || !branchEl) return;

            let branch = branchEl.value;
            const isTieUp = window.currentUser && window.currentUser.status === 'tieup';
            if (isTieUp) branch = window.currentUser.branch || '';

            if (!branch) {
                reportList.innerHTML = '<div class="text-xs text-slate-400 italic text-center py-8">Select a branch to view report.</div>';
                countEl.innerText = "0";
                return;
            }

            const users = (window.cachedData && window.cachedData.users) || [];
            const attendanceData = (window.cachedData && window.cachedData.attendance) || [];
            const students = users.filter(u => u.role !== 'admin' && ['approved', 'blocked', 'expired'].includes(u.status) && u.branch === branch);

            const viewYear = viewDate.getFullYear();

            const now = new Date();
            const isCurrentMonth = viewMonth === now.getMonth() && viewYear === now.getFullYear();

            const prevMonth = viewMonth === 0 ? 11 : viewMonth - 1;
            const prevYear = viewMonth === 0 ? viewYear - 1 : viewYear;

            const shortMonth = viewDate.toLocaleString('default', { month: 'short' });

                    <div class="flex items-center gap-0.5">
                        <button type="button" onclick="changeReportMonth(1)" title="Next Month" class="text-slate-400 hover:text-emerald-600 p-1 rounded hover:bg-white transition-colors"><i class="fas fa-chevron-right text-xs"></i></button>
                        <button type="button" onclick="changeReportYear(1)" title="Next Year" class="text-slate-400 hover:text-emerald-600 p-1 rounded hover:bg-white transition-colors"><i class="fas fa-angle-double-right text-xs"></i></button>

            const reportHtml = students.map(u => {
                const studentAtt = attendanceData.filter(a => a.username === u.username && a.status !== 'pending');

                    const d = new Date(a.date);
                    return !isNaN(d.getTime()) && d.getMonth() === viewMonth && d.getFullYear() === viewYear;

                const prevMonthAtt = studentAtt.filter(a => {
                    const d = new Date(a.date);
                    return !isNaN(d.getTime()) && d.getMonth() === prevMonth && d.getFullYear() === prevYear;
                });
                const selectedYearAtt = studentAtt.filter(a => {
                    const d = new Date(a.date);
                    return !isNaN(d.getTime()) && d.getFullYear() === viewYear;
                });

                const dayCounts = {};
                selectedMonthAtt.forEach(a => {
                    const day = new Date(a.date).getDate();
                    dayCounts[day] = (dayCounts[day] || 0) + 1;
                });
                const daysSorted = Object.keys(dayCounts).map(Number).sort((a, b) => a - b);
                const dateChipsHtml = daysSorted.length > 0
                    ? `<div class="flex flex-wrap gap-1 mt-1.5">${daysSorted.map(day => `<span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded">${shortMonth} ${day}${dayCounts[day] > 1 ? ` (${dayCounts[day]}x)` : ''}</span>`).join('')}</div>`
                    : `<div class="text-[10px] text-slate-400 italic mt-1">No classes in ${shortMonth} ${viewYear}</div>`;

                const safeName = escapeJs(u.username);
                const viewIso = new Date(viewYear, viewMonth, 1).toISOString();

                return `
                <div class="flex justify-between items-start p-3 bg-white rounded-lg border border-slate-200 shadow-sm mb-1 hover:border-emerald-300 transition-colors gap-2">
                    <div class="min-w-0 flex-grow">
                        <span class="text-sm font-bold text-slate-700 cursor-pointer hover:text-emerald-600 underline" onclick="openStudentCalendar('${safeName}', '${viewIso}')">${u.username}</span>
                        ${dateChipsHtml}
                    </div>
                    <div class="flex flex-col items-end gap-1 flex-shrink-0">
                        <span class="text-xs font-bold ${selectedMonthAtt.length >= 8 ? 'text-emerald-600' : 'text-slate-500'} bg-slate-100 px-2 py-1 rounded">${shortMonth}: ${selectedMonthAtt.length} / 8</span>
                        <span class="text-[10px] font-bold text-slate-400">Prev Month: ${prevMonthAtt.length}</span>
                        <span class="text-[10px] font-bold text-slate-400">${viewYear} Total: ${selectedYearAtt.length}</span>
                    </div>
                </div>
                `;
            }).join('');

            reportList.innerHTML = navHeaderHtml + (students.length ? reportHtml : '<div class="text-xs text-slate-400 italic text-center py-8">No students found.</div>');
        }

        window.toggleAttendanceReport = function() {

            const listEl = document.getElementById('pendingAttendanceList');

            if (!listEl || !countEl) return;

        window.submitAttendance = async function() {
            const dateInput = document.getElementById('attendanceDate').value;
            if (!dateInput) { showToast('Please select a date first', 'error'); return; }
            if (window.tempAttendanceList.length === 0) { showToast('To-Do List is empty', 'error'); return; }

            const btn = document.getElementById('btnSubmitAttendance');
            const originalText = btn.innerHTML;
            setButtonLoading(btn, true);

            const isTieUp = window.currentUser && window.currentUser.status === 'tieup';
            const attStatus = isTieUp ? 'pending' : 'approved';
            const isoDate = new Date(dateInput).toISOString();

            const records = window.tempAttendanceList.map(u => ({ username: u, date: isoDate, status: attStatus }));

            const response = await saveAttendanceAPI(records);
            setButtonLoading(btn, false, originalText);

            if (response && response.success) {
                showToast(isTieUp ? 'Attendance sent for Admin Approval!' : 'Attendance saved successfully!', 'success');
                window.tempAttendanceList = [];
                const searchInput = document.getElementById('attendanceSearch');
                if (searchInput) searchInput.value = '';

                await refreshData(false);
            } else {
                showToast((response && response.message) || 'Failed to save attendance', 'error');

        window.renderAdminSavedCalendar = function(dateObj) {
            const isTieUp = window.currentUser && window.currentUser.status === 'tieup';

            const users = (window.cachedData && window.cachedData.users) || [];
            const branchMap = {};
            users.forEach(u => branchMap[u.username] = u.branch);

            const attendanceData = (window.cachedData && window.cachedData.attendance) || [];
            let filteredAttendance = attendanceData;
            if (isTieUp) {
                filteredAttendance = attendanceData.filter(a => branchMap[a.username] === window.currentUser.branch);
            }

            const viewDate = dateObj || new Date();
            const currentMonth = viewDate.getMonth();
            const currentYear = viewDate.getFullYear();

            const now = new Date();
            const isCurrentMonth = currentMonth === now.getMonth() && currentYear === now.getFullYear();

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthName = viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const thisMonthAttendance = filteredAttendance.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });

            const thisYearAttendance = filteredAttendance.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getFullYear() === currentYear;
            });

            const attendanceByDay = {};
            thisMonthAttendance.forEach(a => {
                const day = new Date(a.date).getDate();
                if (!attendanceByDay[day]) attendanceByDay[day] = { count: 0, hasPending: false };
                attendanceByDay[day].count++;
                if (a.status === 'pending') attendanceByDay[day].hasPending = true;
            });

            let gridHtml = '';
            const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            dayNames.forEach(d => gridHtml += `<div class="text-center text-[10px] font-bold text-slate-400 pb-1">${d}</div>`);

            for (let i = 0; i < firstDay; i++) gridHtml += `<div></div>`;

            for (let day = 1; day <= daysInMonth; day++) {
                const dayData = attendanceByDay[day] || { count: 0, hasPending: false };
                const marksCount = dayData.count;
                let marksHtml = '';

                for (let m = 0; m < Math.min(marksCount, 3); m++) {
                    marksHtml += `<span class="${dayData.hasPending ? 'calendar-mark-pending' : 'calendar-mark'}"></span>`;
                }
                if (marksCount > 3) marksHtml += `<span class="text-[8px] font-bold ${dayData.hasPending ? 'text-amber-600' : 'text-emerald-600'} ml-0.5">+${marksCount - 3}</span>`;

                const fullDateLabel = new Date(currentYear, currentMonth, day).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                const titleAttr = marksCount > 0 ? `${fullDateLabel} - ${marksCount} ${marksCount > 1 ? 'records' : 'record'}` : fullDateLabel;
                const isAttended = marksCount > 0 ? (dayData.hasPending ? 'pending shadow-sm admin-interactive' : 'attended shadow-sm admin-interactive') : 'bg-slate-50 text-slate-400';
                const dateStr = new Date(currentYear, currentMonth, day).toISOString();

                gridHtml += `
                    <div class="calendar-day ${isAttended} relative" title="${escapeAttr(titleAttr)}" ${marksCount > 0 ? `onclick="openAdminDayView('${dateStr}')"` : ''}>
                        <span>${day}</span>
                        ${marksCount > 0 ? `<div class="flex flex-wrap justify-center mt-1 w-full px-1 items-center">${marksHtml}</div>` : ''}
                    </div>
                `;
            }

            const modalHtml = `
                <div id="adminSavedCalendarModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-emerald-500 p-4 flex justify-between items-center text-white flex-shrink-0">
                            <h3 class="font-bold text-lg"><i class="fas fa-calendar-check mr-2"></i> Saved Attendance</h3>
                            <button onclick="closeAdminSavedCalendar()" class="text-emerald-100 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto">
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="changeAdminCalendarYear(-1)" title="Previous Year" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-angle-double-left"></i></button>
                                    <button type="button" onclick="changeAdminCalendarMonth(-1)" title="Previous Month" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-chevron-left"></i></button>
                                </div>
                                <div class="text-center font-bold text-slate-700 text-base md:text-lg">${monthName}</div>
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="changeAdminCalendarMonth(1)" title="Next Month" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-chevron-right"></i></button>
                                    <button type="button" onclick="changeAdminCalendarYear(1)" title="Next Year" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-angle-double-right"></i></button>
                                </div>
                            </div>
                            ${!isCurrentMonth ? `
                            <div class="text-center mb-3">
                                <button type="button" onclick="resetAdminCalendarToday()" class="text-[11px] font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-full border border-emerald-200 transition-colors">
                                    <i class="fas fa-undo mr-1"></i> Back to Current Month
                                </button>
                            </div>
                            ` : ''}
                            <div class="calendar-grid">
                                ${gridHtml}
                            </div>
                            <div class="mt-4 flex flex-col gap-2">
                                <div class="text-center text-xs text-slate-500 bg-slate-50 py-2 rounded-lg border border-slate-100">
                                    Records in ${monthName}: <b class="text-emerald-600">${thisMonthAttendance.length}</b>
                                </div>
                                <div class="text-center text-xs text-slate-400 bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                                    Total Records in ${currentYear}: <b class="text-slate-600">${thisYearAttendance.length}</b>
                                </div>
                            </div>
                            <div class="mt-3 text-center text-xs text-slate-400 italic">
                                Click on a highlighted date to view and manage students.
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const container = document.getElementById('global-modals');
            const existingCal = document.getElementById('adminSavedCalendarModal');
            const wasVisible = existingCal && !existingCal.classList.contains('hidden');
            if (existingCal) existingCal.remove();

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = modalHtml;
            const newCal = tempDiv.firstElementChild;
            if (wasVisible) newCal.classList.remove('hidden');
            container.prepend(newCal);
        };

        window.changeAdminCalendarMonth = function(dir) {
            const cur = window.currentAdminCalendarDate || new Date();
            window.currentAdminCalendarDate = new Date(cur.getFullYear(), cur.getMonth() + dir, 1);
            renderAdminSavedCalendar(window.currentAdminCalendarDate);
            const modal = document.getElementById('adminSavedCalendarModal');
            if (modal) modal.classList.remove('hidden');
        };

        window.changeAdminCalendarYear = function(dir) {

            window.currentAdminCalendarDate = new Date(cur.getFullYear() + dir, cur.getMonth(), 1);
            renderAdminSavedCalendar(window.currentAdminCalendarDate);
            const modal = document.getElementById('adminSavedCalendarModal');
            if (modal) modal.classList.remove('hidden');
        };

            window.currentAdminCalendarDate = new Date(now.getFullYear(), now.getMonth(), 1);

                if (isTieUp && match) {
                    match = branchMap[a.username] === window.currentUser.branch;
                }

        // --- INDIVIDUAL STUDENT CALENDAR MODAL (MONTH & YEAR HISTORY) ---
        window.openStudentCalendar = function(studentUsername, initialIsoDate = null) {
            window.studentCalModalUsername = studentUsername;
            const baseDate = initialIsoDate ? new Date(initialIsoDate) : new Date();
            if (!isNaN(baseDate.getTime())) {
                window.studentCalModalDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
            } else {
                const now = new Date();
                window.studentCalModalDate = new Date(now.getFullYear(), now.getMonth(), 1);
            }
            window.renderStudentCalendarModal();
        };

        window.changeStudentCalModalMonth = function(delta) {
            const cur = window.studentCalModalDate || new Date();
            window.studentCalModalDate = new Date(cur.getFullYear(), cur.getMonth() + delta, 1);
            window.renderStudentCalendarModal();
        };

        window.changeStudentCalModalYear = function(delta) {
            const cur = window.studentCalModalDate || new Date();
            window.studentCalModalDate = new Date(cur.getFullYear() + delta, cur.getMonth(), 1);
            window.renderStudentCalendarModal();
        };

        window.resetStudentCalModalToday = function() {
            const now = new Date();
            window.studentCalModalDate = new Date(now.getFullYear(), now.getMonth(), 1);
            window.renderStudentCalendarModal();
        };

        window.renderStudentCalendarModal = function() {
            const studentUsername = window.studentCalModalUsername;
            if (!studentUsername) return;

            const attendanceData = (window.cachedData && window.cachedData.attendance) || [];
            const studentAllRecords = attendanceData.filter(a => a.username === studentUsername);
            const studentApprovedRecords = studentAllRecords.filter(a => a.status !== 'pending');

            const viewDate = window.studentCalModalDate || new Date();
            const viewMonth = viewDate.getMonth();
            const viewYear = viewDate.getFullYear();

            const now = new Date();
            const isCurrentMonth = viewMonth === now.getMonth() && viewYear === now.getFullYear();

            const selectedMonthAll = studentAllRecords.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getMonth() === viewMonth && d.getFullYear() === viewYear;
            });

            const selectedMonthApproved = studentApprovedRecords.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getMonth() === viewMonth && d.getFullYear() === viewYear;
            });

            const selectedYearApproved = studentApprovedRecords.filter(a => {
                const d = new Date(a.date);
                return !isNaN(d.getTime()) && d.getFullYear() === viewYear;
            });

            const attendanceByDay = {};
            selectedMonthAll.forEach(a => {
                const day = new Date(a.date).getDate();
                if (!attendanceByDay[day]) attendanceByDay[day] = { approved: 0, pending: 0 };
                if (a.status === 'pending') attendanceByDay[day].pending++;
                else attendanceByDay[day].approved++;
            });

            const firstDay = new Date(viewYear, viewMonth, 1).getDay();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const monthName = viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            const shortMonth = viewDate.toLocaleString('default', { month: 'short' });

            let gridHtml = '';
            const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            dayNames.forEach(d => gridHtml += `<div class="text-center text-[10px] font-bold text-slate-400 pb-1">${d}</div>`);

            for (let i = 0; i < firstDay; i++) gridHtml += `<div></div>`;

            for (let day = 1; day <= daysInMonth; day++) {
                const info = attendanceByDay[day] || { approved: 0, pending: 0 };
                const totalMarks = info.approved + info.pending;
                const hasPendingOnly = info.approved === 0 && info.pending > 0;
                let marksHtml = '';
                for (let m = 0; m < Math.min(totalMarks, 3); m++) {
                    marksHtml += `<span class="${info.pending > 0 && m >= info.approved ? 'calendar-mark-pending' : 'calendar-mark'}"></span>`;
                }
                if (totalMarks > 3) marksHtml += `<span class="text-[8px] font-bold ${hasPendingOnly ? 'text-amber-600' : 'text-emerald-600'} ml-0.5">+${totalMarks - 3}</span>`;

                const fullDateLabel = new Date(viewYear, viewMonth, day).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                let statusText = '';
                if (info.approved > 0 && info.pending > 0) statusText = ` - ${info.approved} Approved, ${info.pending} Pending`;
                else if (info.approved > 0) statusText = ` - Attended (${info.approved} ${info.approved > 1 ? 'classes' : 'class'})`;
                else if (info.pending > 0) statusText = ` - Pending Approval (${info.pending})`;

                const dayClass = totalMarks > 0 ? (hasPendingOnly ? 'pending shadow-sm' : 'attended shadow-sm') : 'bg-slate-50 text-slate-400';

                gridHtml += `
                    <div class="calendar-day ${dayClass} relative" title="${escapeAttr(fullDateLabel + statusText)}">
                        <span>${day}</span>
                        ${totalMarks > 0 ? `<div class="flex flex-wrap justify-center mt-1 w-full px-1 items-center">${marksHtml}</div>` : ''}
                    </div>
                `;
            }

            const attendedDaysSorted = Object.keys(attendanceByDay).map(Number).sort((a, b) => a - b);
            const attendedDatesHtml = attendedDaysSorted.length > 0
                ? attendedDaysSorted.map(day => {
                    const info = attendanceByDay[day];
                    const badges = [];
                    if (info.approved > 0) {
                        badges.push(`<span class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded text-[11px] font-bold">${shortMonth} ${day}, ${viewYear}${info.approved > 1 ? ` (${info.approved}x)` : ''}</span>`);
                    }
                    if (info.pending > 0) {
                        badges.push(`<span class="inline-block bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded text-[11px] font-bold">${shortMonth} ${day}, ${viewYear} (Pending${info.pending > 1 ? ` ${info.pending}x` : ''})</span>`);
                    }
                    return badges.join('');
                }).join('')
                : `<span class="text-xs text-slate-400 italic">No attendance recorded for ${monthName}.</span>`;

            const existingModal = document.getElementById('studentCalendarModal');
            if (existingModal) existingModal.remove();

            const modalHtml = `
                <div id="studentCalendarModal" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm fade-in">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[90vh]">
                        <div class="bg-brand-600 p-4 flex justify-between items-center text-white flex-shrink-0">
                            <h3 class="font-bold text-lg truncate pr-2"><i class="fas fa-user mr-2"></i> ${studentUsername}</h3>
                            <button onclick="document.getElementById('studentCalendarModal').remove()" class="text-brand-100 hover:text-white"><i class="fas fa-times text-xl"></i></button>
                        </div>
                        <div class="p-6 overflow-y-auto">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="changeStudentCalModalYear(-1)" title="Previous Year" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-angle-double-left"></i></button>
                                    <button type="button" onclick="changeStudentCalModalMonth(-1)" title="Previous Month" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-chevron-left"></i></button>
                                </div>
                                <div class="text-center font-bold text-slate-700 text-base md:text-lg">${monthName}</div>
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="changeStudentCalModalMonth(1)" title="Next Month" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-chevron-right"></i></button>
                                    <button type="button" onclick="changeStudentCalModalYear(1)" title="Next Year" class="text-slate-400 hover:text-emerald-600 p-1.5 rounded hover:bg-slate-100 transition-colors"><i class="fas fa-angle-double-right"></i></button>
                                </div>
                            </div>
                            ${!isCurrentMonth ? `
                            <div class="text-center mb-3">
                                <button type="button" onclick="resetStudentCalModalToday()" class="text-[11px] font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1 rounded-full border border-emerald-200 transition-colors">
                                    <i class="fas fa-undo mr-1"></i> Back to Current Month
                                </button>
                            </div>
                            ` : ''}
                            <div class="calendar-grid">
                                ${gridHtml}
                            </div>
                            <div class="mt-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-2"><i class="fas fa-calendar-day text-emerald-500 mr-1"></i> Attended Dates (${monthName})</div>
                                <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
                                    ${attendedDatesHtml}
                                </div>
                            </div>
                            <div class="mt-4 flex flex-col gap-2">
                                <div class="text-center text-sm text-slate-500 bg-slate-50 py-2 rounded-lg border border-slate-100">
                                    Classes Attended (${monthName}): <b class="text-emerald-600">${selectedMonthApproved.length}</b>
                                </div>
                                <div class="text-center text-xs text-slate-400 bg-slate-50 py-1.5 rounded-lg border border-slate-100">
                                    Total Classes in ${viewYear}: <b class="text-slate-600">${selectedYearApproved.length}</b>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = modalHtml;
            document.getElementById('global-modals').appendChild(tempDiv.firstElementChild);
        };

        window.deleteSavedAttendance = async function(dateStr, username, btn) {
            if (!confirm(`Delete attendance record for ${username}?`)) return;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const response = await deleteAttendanceAPI(dateStr, username);
            if (response && response.success) {
                showToast('Attendance removed', 'success');
                await refreshData(false);
                closeAdminDayView();
                openAdminDayView(dateStr);
                renderAdminSavedCalendar(window.currentAdminCalendarDate);
            } else {
                showToast('Failed to delete', 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };

        // --- NAVIGATION & SIDEBAR ---
        window.navigateTo = function(viewName) {
            if (ROUTES[viewName]) {
                window.location.href = ROUTES[viewName];
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar || !overlay) return;
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        window.handleLogout = function() {
            window.currentUser = null;
            sessionStorage.removeItem('cta_session_user');
            showToast('Logged out', 'info');
            setTimeout(() => {
                window.location.href = ROUTES.login;
            }, 300);
        };

        // --- DATA LOADER & SESSION GUARD ---
        async function loadAttendancePage(showLoader = true, showRefreshToast = false) {
            const rawSession = sessionStorage.getItem('cta_session_user');
            if (!rawSession) {
                window.location.href = ROUTES.login;
                return;
            }

            let sessionUser;
            try {
                sessionUser = JSON.parse(rawSession);
            } catch (e) {
                sessionStorage.removeItem('cta_session_user');
                window.location.href = ROUTES.login;
                return;
            }

            if (sessionUser.role !== 'admin' && sessionUser.status !== 'tieup') {
                window.location.href = ROUTES.student;
                return;
            }

            // Preserve selected date and branch across refreshes
            const prevDateEl = document.getElementById('attendanceDate');
            const prevBranchEl = document.getElementById('attendanceBranch');
            const savedDateVal = prevDateEl ? prevDateEl.value : '';
            const savedBranchVal = prevBranchEl ? prevBranchEl.value : '';

            window.currentUser = sessionUser;
            const app = document.getElementById('app');

            if (showLoader) {
                app.innerHTML = `
                    <div class="text-brand-600 font-bold flex flex-col items-center">
                        <div class="loader mb-2 w-8 h-8 border-4"></div>
                        Connecting to Academy Server...
                    </div>
                `;
            }

            try {
                const [users, attendance] = await Promise.all([
                    fetchUsers(),
                    fetchAttendance()
                ]);

                if (!Array.isArray(users)) {
                    app.innerHTML = `
                        <div class="glass-panel rounded-xl p-8 text-center max-w-md mx-auto">
                            <i class="fas fa-wifi text-3xl text-red-500 mb-3"></i>
                            <h2 class="font-bold text-lg text-slate-800 mb-2">Connection Error</h2>
                            <p class="text-slate-500 text-sm mb-4">Unable to reach Academy Server. Please check your connection and try again.</p>
                            <button onclick="loadAttendancePage(true, false)" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition-colors">Retry</button>
                        </div>
                    `;
                    return;
                }

                // Sync current user details (branch/status) from latest server data
                const freshSelf = users.find(u => String(u.username).toLowerCase() === String(sessionUser.username).toLowerCase());
                if (freshSelf) {
                    if (freshSelf.role !== 'admin' && freshSelf.status !== 'tieup') {
                        sessionStorage.removeItem('cta_session_user');
                        window.location.href = ROUTES.login;
                        return;
                    }
                    window.currentUser = freshSelf;
                    sessionStorage.setItem('cta_session_user', JSON.stringify(freshSelf));
                }

                window.cachedData = {
                    users: users || [],
                    attendance: attendance || []
                };

                app.innerHTML = renderAdminAttendance(window.cachedData, savedDateVal, savedBranchVal);
                renderAttendanceStudents();
                renderPendingAttendance();

                if (showRefreshToast) {
                    showToast("Data Refreshed", "info");
                }
            } catch (err) {
                console.error('loadAttendancePage error:', err);
                showToast('Failed to load attendance tracker', 'error');
            }
        }

        window.refreshData = async function(notify = true) {
            await loadAttendancePage(false, notify);
        };

        // Start Page
        loadAttendancePage(true, false);
    </script>
</body>
</html>
